<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Shortener{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <div class="header-inner">
            <a class="brand" href="{{ url_for('index') }}">Shortener</a>
            <span class="version">Версия {{ version }}</span>
            <nav aria-label="Основная навигация">
                <a href="{{ url_for('index') }}">Главная</a>
                <a href="{{ url_for('link_form') }}">Создать ссылку</a>
                <a href="{{ url_for('link_list') }}">Список ссылок</a>
                <a href="{{ url_for('access_denied') }}">Пример отказа</a>
            </nav>
        </div>
    </header>
    <main>{% block content %}{% endblock %}</main>
</body>
</html>
